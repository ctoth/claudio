version: "2"

linters:
  enable:
    - modernize
    - usetesting
    - errorlint
    - intrange
    - perfsprint
    - gocritic
    - unparam
    - dupl
    - sloglint
  settings:
    dupl:
      threshold: 150
    sloglint:
      no-mixed-args: true
      key-naming-case: snake
      # "error" is the only error key (#44).
      forbidden-keys:
        - err
    staticcheck:
      checks:
        - all
        - -QF*
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
